<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Diabetes Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;
        }

        .container {
            width: min(
                100% - 24px,
                700px
            );

            margin: 0 auto;
            padding: 20px 0 60px;
        }

        h1 {
            margin-bottom: 6px;
        }

        h2 {
            margin-top: 0;
        }

        .subtitle {
            color: #666;
            margin-top: 0;
        }

        .card {
            background: white;

            border-radius: 18px;

            padding: 18px;

            margin-bottom: 16px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;

            font-size: 14px;
            font-weight: 600;

            margin-top: 12px;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;

            font-size: 16px;

            border-radius: 12px;

            padding: 12px;
        }

        input,
        select,
        textarea {
            border:
                1px solid #d2d2d7;

            background: white;
        }

        textarea {
            resize: vertical;
        }

        button {
            border: none;

            background: #007aff;
            color: white;

            font-weight: 600;

            margin-top: 14px;

            cursor: pointer;
        }

        button.secondary {
            background: #e9e9ee;
            color: #1d1d1f;
        }

        button.danger {
            background: #ff3b30;
        }

        button.small {
            width: auto;
            padding: 8px 12px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .status {
            margin-top: 12px;

            padding: 10px;

            border-radius: 10px;

            background: #f1f1f3;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .status.success {
            background: #e8f7ea;
        }

        .status.error {
            background: #fdeaea;
        }

        .user-row {
            display: flex;

            justify-content:
                space-between;

            gap: 12px;

            align-items: center;
        }

        .user-row button {
            margin: 0;
        }

        .grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }

        .meal-item {
            border:
                1px solid #ddd;

            border-radius: 14px;

            padding: 12px;

            margin-top: 12px;
        }

        pre {
            overflow-x: auto;

            white-space: pre-wrap;

            font-size: 13px;

            background: #111;

            color: #eee;

            border-radius: 12px;

            padding: 12px;
        }

        .tabs {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px;

            margin-bottom: 16px;
        }

        .tabs button {
            margin: 0;

            background: white;
            color: #007aff;

            border:
                1px solid #007aff;
        }

        @media (
            max-width: 500px
        ) {
            .grid {
                grid-template-columns:
                    1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Diabetes Assistant</h1>

    <p class="subtitle">
        Testovací mobilní rozhraní
    </p>


    <div
        id="login-card"
        class="card"
    >
        <h2>Přihlášení</h2>

        <label>
            Email
        </label>

        <input
            id="login-email"
            type="email"
            autocomplete="email"
        >

        <label>
            Heslo
        </label>

        <input
            id="login-password"
            type="password"
            autocomplete="current-password"
        >

        <button
            onclick="login()"
        >
            Přihlásit
        </button>

        <div
            id="login-status"
            class="status hidden"
        ></div>
    </div>


    <div
        id="app"
        class="hidden"
    >

        <div class="card">

            <div class="user-row">

                <div>
                    <strong
                        id="user-name"
                    ></strong>

                    <br>

                    <small
                        id="user-email"
                    ></small>
                </div>

                <button
                    class="danger small"
                    onclick="logout()"
                >
                    Odhlásit
                </button>

            </div>

        </div>


        <div class="tabs">

            <button
                onclick="showSection(
                    'glucose-section'
                )"
            >
                Glykémie
            </button>

            <button
                onclick="showSection(
                    'meal-section'
                )"
            >
                Jídlo
            </button>

            <button
                onclick="showSection(
                    'insulin-section'
                )"
            >
                Inzulín
            </button>

            <button
                onclick="showSection(
                    'activity-section'
                )"
            >
                Aktivita
            </button>

        </div>


        <div
            id="glucose-section"
            class="card data-section"
        >

            <h2>Glykémie</h2>

            <label>
                Hodnota mmol/l
            </label>

            <input
                id="glucose-value"
                type="number"
                step="0.1"
                min="0.1"
            >

            <label>
                Čas měření
            </label>

            <input
                id="glucose-time"
                type="datetime-local"
            >

            <button
                onclick="saveGlucose()"
            >
                Uložit glykémii
            </button>

            <div
                id="glucose-status"
                class="status hidden"
            ></div>

        </div>


        <div
            id="meal-section"
            class="card data-section hidden"
        >

            <h2>Jídlo</h2>

            <label>
                Čas jídla
            </label>

            <input
                id="meal-time"
                type="datetime-local"
            >

            <label>
                Popis
            </label>

            <input
                id="meal-description"
                placeholder="Např. oběd"
            >

            <label>
                Celkem sacharidů (g)
            </label>

            <input
                id="meal-carbs"
                type="number"
                step="0.1"
                min="0"
            >

            <label>
                Poznámka
            </label>

            <textarea
                id="meal-note"
                rows="2"
            ></textarea>

            <h3>Položky jídla</h3>

            <div
                id="meal-items"
            ></div>

            <button
                class="secondary"
                onclick="addMealItem()"
            >
                + Přidat položku
            </button>

            <button
                onclick="saveMeal()"
            >
                Uložit jídlo
            </button>

            <div
                id="meal-status"
                class="status hidden"
            ></div>

        </div>


        <div
            id="insulin-section"
            class="card data-section hidden"
        >

            <h2>Inzulín</h2>

            <label>
                Typ inzulínu
            </label>

            <select
                id="insulin-type"
                onchange=
                    "updateInsulinForm()"
            >

                <option value="NOVORAPID">
                    NovoRapid
                </option>

                <option value="TRESIBA">
                    Tresiba
                </option>

            </select>

            <label>
                Jednotky
            </label>

            <input
                id="insulin-units"
                type="number"
                step="0.1"
                min="0.1"
            >

            <label>
                Čas aplikace
            </label>

            <input
                id="insulin-time"
                type="datetime-local"
            >

            <div
                id="meal-link-wrapper"
            >

                <label>
                    Meal ID
                </label>

                <input
                    id="insulin-meal-id"
                    placeholder=
                        "Volitelné"
                >

                <small>
                    Po uložení jídla se sem
                    automaticky doplní jeho ID.
                </small>

            </div>

            <label>
                Poznámka
            </label>

            <textarea
                id="insulin-note"
                rows="2"
            ></textarea>

            <button
                onclick="saveInsulin()"
            >
                Uložit inzulín
            </button>

            <div
                id="insulin-status"
                class="status hidden"
            ></div>

        </div>


        <div
            id="activity-section"
            class="card data-section hidden"
        >

            <h2>Aktivita</h2>

            <label>
                Typ
            </label>

            <select
                id="activity-type"
            >

                <option value="GYM">
                    Gym
                </option>

                <option value="RUNNING">
                    Běh
                </option>

                <option value="CYCLING">
                    Kolo
                </option>

                <option value="TEAM_SPORT">
                    Týmový sport
                </option>

                <option value="WALKING">
                    Chůze
                </option>

                <option value="OTHER">
                    Jiné
                </option>

            </select>

            <label>
                Intenzita
            </label>

            <select
                id="activity-intensity"
            >

                <option value="">
                    Neuvedeno
                </option>

                <option value="LOW">
                    Nízká
                </option>

                <option value="MEDIUM">
                    Střední
                </option>

                <option value="HIGH">
                    Vysoká
                </option>

            </select>

            <div class="grid">

                <div>
                    <label>
                        Začátek
                    </label>

                    <input
                        id="activity-start"
                        type="datetime-local"
                    >
                </div>

                <div>
                    <label>
                        Konec
                    </label>

                    <input
                        id="activity-end"
                        type="datetime-local"
                    >
                </div>

            </div>

            <label>
                Poznámka
            </label>

            <textarea
                id="activity-note"
                rows="2"
            ></textarea>

            <button
                onclick="saveActivity()"
            >
                Uložit aktivitu
            </button>

            <div
                id="activity-status"
                class="status hidden"
            ></div>

        </div>


        <div class="card">

            <h2>Aktuální situace</h2>

            <button
                onclick="loadSituation()"
            >
                Načíst aktuální situaci
            </button>

            <div
                id="situation-status"
                class="status hidden"
            ></div>

            <pre
                id="situation-output"
                class="hidden"
            ></pre>

        </div>


        <div class="card">

            <h2>Podobné situace</h2>

            <button
                onclick="loadSimilar()"
            >
                Najít podobné situace
            </button>

            <div
                id="similar-status"
                class="status hidden"
            ></div>

            <pre
                id="similar-output"
                class="hidden"
            ></pre>

        </div>

    </div>

</div>


<script>

let token = (
    localStorage.getItem(
        "access_token"
    )
);

let currentUser = null;


function authHeaders() {
    return {
        "Content-Type":
            "application/json",

        "Authorization":
            `Bearer ${token}`
    };
}


async function apiRequest(
    url,
    options = {}
) {
    const response = await fetch(
        url,
        options
    );

    let data = null;

    try {
        data = await response.json();
    }
    catch {
        data = null;
    }

    if (!response.ok) {
        const message =
            data?.detail
            ?? `HTTP ${response.status}`;

        throw new Error(
            message
        );
    }

    return data;
}


function showStatus(
    elementId,
    message,
    success = true
) {
    const element =
        document.getElementById(
            elementId
        );

    element.textContent =
        message;

    element.classList.remove(
        "hidden",
        "success",
        "error"
    );

    element.classList.add(
        success
            ? "success"
            : "error"
    );
}


function localDatetimeValue(
    date = new Date()
) {
    const offset =
        date.getTimezoneOffset();

    const local =
        new Date(
            date.getTime()
            - offset * 60000
        );

    return local
        .toISOString()
        .slice(
            0,
            16
        );
}


function toIso(
    value
) {
    return new Date(
        value
    ).toISOString();
}


async function login() {

    const email =
        document.getElementById(
            "login-email"
        ).value.trim();

    const password =
        document.getElementById(
            "login-password"
        ).value;

    try {

        const result =
            await apiRequest(
                "/auth/login",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email,
                            password
                        })
                }
            );

        token =
            result.access_token;

        localStorage.setItem(
            "access_token",
            token
        );

        await loadCurrentUser();

    }
    catch (error) {

        showStatus(
            "login-status",
            error.message,
            false
        );

    }
}


async function loadCurrentUser() {

    if (!token) {
        return;
    }

    try {

        currentUser =
            await apiRequest(
                "/auth/me",
                {
                    headers:
                        authHeaders()
                }
            );

        document.getElementById(
            "login-card"
        ).classList.add(
            "hidden"
        );

        document.getElementById(
            "app"
        ).classList.remove(
            "hidden"
        );

        document.getElementById(
            "user-name"
        ).textContent =
            currentUser.display_name;

        document.getElementById(
            "user-email"
        ).textContent =
            currentUser.email;

    }
    catch {

        logout();

    }
}


function logout() {

    token = null;
    currentUser = null;

    localStorage.removeItem(
        "access_token"
    );

    document.getElementById(
        "app"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "login-card"
    ).classList.remove(
        "hidden"
    );

}


function showSection(
    sectionId
) {

    document.querySelectorAll(
        ".data-section"
    ).forEach(
        section => {
            section.classList.add(
                "hidden"
            );
        }
    );

    document.getElementById(
        sectionId
    ).classList.remove(
        "hidden"
    );

}


async function saveGlucose() {

    try {

        const value =
            parseFloat(
                document.getElementById(
                    "glucose-value"
                ).value
            );

        const measuredAt =
            document.getElementById(
                "glucose-time"
            ).value;

        const result =
            await apiRequest(
                "/glucose",
                {
                    method:
                        "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({
                            user_id:
                                currentUser.id,

                            measured_at:
                                toIso(
                                    measuredAt
                                ),

                            value_mmol_l:
                                value,

                            source:
                                "MANUAL"
                        })
                }
            );

        showStatus(
            "glucose-status",
            `Uloženo: ${result.value_mmol_l} mmol/l`
        );

    }
    catch (error) {

        showStatus(
            "glucose-status",
            error.message,
            false
        );

    }
}


function addMealItem() {

    const container =
        document.getElementById(
            "meal-items"
        );

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "meal-item";

    item.innerHTML = `
        <label>
            Název potraviny
        </label>

        <input
            class="item-name"
            placeholder="Např. brambory"
        >

        <label>
            Úprava
        </label>

        <input
            class="item-preparation"
            placeholder="Např. pečené"
        >

        <div class="grid">

            <div>
                <label>
                    Množství (g)
                </label>

                <input
                    class="item-amount"
                    type="number"
                    step="0.1"
                    min="0"
                >
            </div>

            <div>
                <label>
                    Sacharidy (g)
                </label>

                <input
                    class="item-carbs"
                    type="number"
                    step="0.1"
                    min="0"
                    oninput="
                        recalculateMealCarbs()
                    "
                >
            </div>

        </div>

        <label>
            Varianta
        </label>

        <input
            class="item-variant"
        >

        <label>
            Poznámka
        </label>

        <input
            class="item-note"
        >

        <button
            type="button"
            class="danger small"
            onclick="
                this.parentElement.remove();
                recalculateMealCarbs();
            "
        >
            Odebrat
        </button>
    `;

    container.appendChild(
        item
    );
}


function recalculateMealCarbs() {

    let total = 0;

    document.querySelectorAll(
        ".item-carbs"
    ).forEach(
        input => {

            const value =
                parseFloat(
                    input.value
                );

            if (!Number.isNaN(
                value
            )) {
                total += value;
            }

        }
    );

    if (total > 0) {

        document.getElementById(
            "meal-carbs"
        ).value =
            total.toFixed(
                1
            );

    }
}


function collectMealItems() {

    const items = [];

    document.querySelectorAll(
        ".meal-item"
    ).forEach(
        element => {

            const foodName =
                element.querySelector(
                    ".item-name"
                ).value.trim();

            if (!foodName) {
                return;
            }

            const amountValue =
                element.querySelector(
                    ".item-amount"
                ).value;

            const carbsValue =
                element.querySelector(
                    ".item-carbs"
                ).value;

            const preparation =
                element.querySelector(
                    ".item-preparation"
                ).value.trim();

            const variant =
                element.querySelector(
                    ".item-variant"
                ).value.trim();

            const note =
                element.querySelector(
                    ".item-note"
                ).value.trim();

            items.push({
                food_name:
                    foodName,

                preparation:
                    preparation
                    || null,

                variant:
                    variant
                    || null,

                amount_g:
                    amountValue
                    ? parseFloat(
                        amountValue
                    )
                    : null,

                carbohydrates_g:
                    carbsValue
                    ? parseFloat(
                        carbsValue
                    )
                    : null,

                note:
                    note
                    || null
            });

        }
    );

    return items;
}


async function saveMeal() {

    try {

        const eatenAt =
            document.getElementById(
                "meal-time"
            ).value;

        const carbs =
            parseFloat(
                document.getElementById(
                    "meal-carbs"
                ).value
            );

        const description =
            document.getElementById(
                "meal-description"
            ).value.trim();

        const note =
            document.getElementById(
                "meal-note"
            ).value.trim();

        const result =
            await apiRequest(
                "/meals",
                {
                    method:
                        "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({
                            user_id:
                                currentUser.id,

                            eaten_at:
                                toIso(
                                    eatenAt
                                ),

                            carbohydrates_g:
                                carbs,

                            description:
                                description
                                || null,

                            note:
                                note
                                || null,

                            items:
                                collectMealItems()
                        })
                }
            );

        document.getElementById(
            "insulin-meal-id"
        ).value =
            result.id;

        showStatus(
            "meal-status",
            (
                `Jídlo uloženo.\n`
                + `Meal ID: ${result.id}`
            )
        );

    }
    catch (error) {

        showStatus(
            "meal-status",
            error.message,
            false
        );

    }
}


function updateInsulinForm() {

    const type =
        document.getElementById(
            "insulin-type"
        ).value;

    const wrapper =
        document.getElementById(
            "meal-link-wrapper"
        );

    if (
        type === "NOVORAPID"
    ) {
        wrapper.classList.remove(
            "hidden"
        );
    }
    else {
        wrapper.classList.add(
            "hidden"
        );

        document.getElementById(
            "insulin-meal-id"
        ).value = "";
    }
}


async function saveInsulin() {

    try {

        const type =
            document.getElementById(
                "insulin-type"
            ).value;

        const units =
            parseFloat(
                document.getElementById(
                    "insulin-units"
                ).value
            );

        const administeredAt =
            document.getElementById(
                "insulin-time"
            ).value;

        const mealId =
            document.getElementById(
                "insulin-meal-id"
            ).value.trim();

        const note =
            document.getElementById(
                "insulin-note"
            ).value.trim();

        const result =
            await apiRequest(
                "/insulin",
                {
                    method:
                        "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({
                            user_id:
                                currentUser.id,

                            meal_id:
                                (
                                    type
                                    === "NOVORAPID"
                                    && mealId
                                )
                                ? mealId
                                : null,

                            insulin_type:
                                type,

                            units:
                                units,

                            administered_at:
                                toIso(
                                    administeredAt
                                ),

                            source:
                                "MANUAL",

                            note:
                                note
                                || null
                        })
                }
            );

        showStatus(
            "insulin-status",
            (
                `Uloženo: `
                + `${result.units} U `
                + `${result.insulin_type}`
            )
        );

    }
    catch (error) {

        showStatus(
            "insulin-status",
            error.message,
            false
        );

    }
}


async function saveActivity() {

    try {

        const type =
            document.getElementById(
                "activity-type"
            ).value;

        const intensity =
            document.getElementById(
                "activity-intensity"
            ).value;

        const start =
            document.getElementById(
                "activity-start"
            ).value;

        const end =
            document.getElementById(
                "activity-end"
            ).value;

        const note =
            document.getElementById(
                "activity-note"
            ).value.trim();

        const result =
            await apiRequest(
                "/activities",
                {
                    method:
                        "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({
                            user_id:
                                currentUser.id,

                            started_at:
                                toIso(
                                    start
                                ),

                            ended_at:
                                toIso(
                                    end
                                ),

                            activity_type:
                                type,

                            intensity:
                                intensity
                                || null,

                            note:
                                note
                                || null
                        })
                }
            );

        showStatus(
            "activity-status",
            (
                `Aktivita uložena: `
                + result.activity_type
            )
        );

    }
    catch (error) {

        showStatus(
            "activity-status",
            error.message,
            false
        );

    }
}


async function loadSituation() {

    try {

        const timestamp =
            new Date()
            .toISOString();

        const url =
            (
                "/situations/build"
                + "?user_id="
                + encodeURIComponent(
                    currentUser.id
                )
                + "&timestamp="
                + encodeURIComponent(
                    timestamp
                )
            );

        const result =
            await apiRequest(
                url,
                {

async function loadSimilar() {

    try {

        const timestamp =
            new Date()
            .toISOString();

        const url =
            (
                "/situations/similar"
                + "?user_id="
                + encodeURIComponent(
                    currentUser.id
                )
                + "&timestamp="
                + encodeURIComponent(
                    timestamp
                )
                + "&limit=10"
            );

        const result =
            await apiRequest(
                url,
                {
                    headers:
                        authHeaders()
                }
            );

        const output =
            document.getElementById(
                "similar-output"
            );

        output.textContent =

        );

}


function initializeTimes() {

    const now =
        localDatetimeValue();

    document.getElementById(
        "glucose-time"
    ).value = now;

    document.getElementById(
        "meal-time"
    ).value = now;

    document.getElementById(
        "insulin-time"
    ).value = now;

    document.getElementById(
        "activity-end"
    ).value = now;

    const start =
        new Date(
            Date.now()
            - 60 * 60 * 1000
        );

    document.getElementById(
        "activity-start"
    ).value =
        localDatetimeValue(
            start
        );
}
